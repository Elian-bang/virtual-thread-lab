server:
  tomcat:
    threads:
      # PLATFORM / CF 모델의 요청 처리 스레드 수. VIRTUAL 에서는 무시된다.
      max: ${LAB_POOL:200}
    accept-count: 10000
    max-connections: 20000

spring:
  threads:
    virtual:
      # VIRTUAL 모델일 때만 true. Tomcat 이 요청마다 가상 스레드를 쓴다.
      enabled: ${LAB_VIRTUAL:false}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/vtlab?useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: labpass
    hikari:
      # H2 의 변수. 이것만 바꿔서 병목이 어디로 옮겨가는지 본다.
      maximum-pool-size: ${LAB_CONN:10}
      connection-timeout: 30000
  sql:
    init:
      mode: always

lab:
  model: ${LAB_MODEL:PLATFORM}
  pool-size: ${LAB_POOL:200}
  channel-ms: ${LAB_CHANNEL_MS:50}
  use-sync: ${LAB_SYNC:false}
  targets: ${LAB_TARGETS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    enable:
      all: true

logging:
  level:
    root: WARN
